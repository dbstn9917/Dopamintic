<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dopamintic</title>

    <!-- "Pretendard Variable" -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <!-- normalize.css -->
    <link rel="stylesheet" href="css/normalize.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <nav class="main-nav">
      <div class="container">
        <ul>
          <li>
            <a href="/" class="a-reset">
              <p class="dopamintic-logo">DOPAMINTIC</p>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="hero-container">
        <div class="container">
          <div>
            <div class="hero-title">
              <h1>기대, 그 이상의 반응을 만들어 내다.</h1>
              <p>타인에게 영감을 전하는 예술가들을 위한 브랜드</p>
            </div>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 1400 1000"
              class="pulse"
            >
              <path
                d="M0 500 
    L750 500
    l25 -25
    l25 75
    l50 -275
    l75 350
    l25 -150
    l15 25
    L1400 500
    "
                stroke="rgba(255, 0, 0, .25)"
                stroke-width="10"
                fill="none"
              />
            </svg>
          </div>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <div class="dopamintic-logo-container">
        <p class="dopamintic-slogan">Keep it Active</p>
        <p class="dopamintic-logo">DOPAMINTIC</p>
      </div>
      <p class="copyright">&copy; 2026 Dopamintic</p>
    </footer>
  </body>
</html>
